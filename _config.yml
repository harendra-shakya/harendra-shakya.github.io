# Site settings
title: Shakya Mirror # site title
description:
  >- # site description  # Follows a logical and philosophical progression: cognition → spirit → existence | A reflective guide to truth, presence, and self-awareness — through mind, soul, and the illusions of life. A space for introspection, clarity, and timeless truth — through the mirror of awareness.
  A reflective journey through mind, soul, and life — to awaken what is already whole.
lang: en-US # default lang
timezone: Asia/Kolkata # set your timezone
image: assets/img/og-image-vagabond.webp # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/harendra-shakya/harendra-shakya.github.io # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Harendra Shakya # author name
  bio: >- # tell to the world
    जब मैं था तब हरि नहीं, अब हरि है मैं नाहीं।
    प्रेम गली अति सांकरी, जामें दो न समाहीं।।

  username: harendra-shakya # general username
  github: harendra-shakya # github username
  twitter: harendrashakya_ # twitter username
  #facebook: facebook_username # facebook username
  #email: your-email@email.com # email adress
  avatar: /assets/img/buddha.webp # change with your own avatar

# URL settings
url: "https://harendra-shakya.github.io" #
baseurl:
permalink: /:slug/
google_analytics: G-NDH3D87F2D
fb_appid:

# Collection setting
collections:
  posts:
    output: true
    permalink: /:slug/

  insights:
    output: true
    permalink: /:slug/

  bhajans:
    output: true
    permalink: /:slug/

  mantra:
    output: true
    permalink: /:slug/

  bodhkarya:
    output: true
    permalink: /:slug/

  sahitya:
    output: true
    permalink: /:slug/

  evergreen:
    output: true
    permalink: /:slug/

  avalokan:
    output: true
    permalink: /:slug/

  notes:
    output: true
    permalink: /:slug/

  checklists:
    output: true
    permalink: /:slug/

  poetry:
    output: true
    permalink: /:slug/

  portfolio:
    output: true
    permalink: /:slug/

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  input: GFM
slugify_mode: "unicode"

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: "insights"
    values:
      layout: "insight"
  - scope:
      path: ""
      type: "poetry"
    values:
      layout: "insight"
  - scope:
      path: ""
      type: "evergreen"
    values:
      layout: "insight"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "null"

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
# theme: harendra-shakya.github.io

sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec
  - archive/
  - docs/
  - _insights/up-next/
  - _posts/up-next/
  - _insights/drafts/
  - _posts/drafts/
  - _sahitya/drafts/
  - _avalokan/drafts/

# Plugins
plugins:
  - jekyll-feed
  # - jekyll-sitemap
  - jekyll-postfiles
# # Configure the plugin
# sitemap:
#   # exclude:
#   #   - "/path/to/exclude" # List any URLs you don't want in the sitemap
#   changefreq: "monthly" # Default changefreq for all pages
#   priority: 0.5 # Default priority for all pages
#   # include:
#   #   - '/specific-page'  # Explicitly include any pages not picked up automatically
